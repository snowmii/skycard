name: Generate Cards

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-themes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out generated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin generated:generated || true
          git checkout generated || git checkout -b generated

      - name: Generate every theme
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }}
          PLAYER_NAME: ${{ vars.PLAYER_NAME }}
          PROFILE_NAME: ${{ vars.PROFILE_NAME }}
        run: >-
          npm run generate --
          "$PLAYER_NAME"
          --profile "$PROFILE_NAME"
          --theme all
          --output generated/card.svg

      - name: Commit generated themes
        run: |
          git add generated/
          git commit --allow-empty -m "chore: regenerate themes"
          git push --set-upstream origin generated
