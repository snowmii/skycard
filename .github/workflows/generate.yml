name: Generate Cards

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-themes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }}
          PLAYER_NAME: ${{ vars.PLAYER_NAME }}
        run: |
          test -n "$HYPIXEL_API_KEY" \
            || { echo "::error::Missing HYPIXEL_API_KEY repository secret."; exit 1; }
          test -n "$PLAYER_NAME" \
            || { echo "::error::Missing PLAYER_NAME repository variable."; exit 1; }

      - name: Generate every theme
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }}
          PLAYER_NAME: ${{ vars.PLAYER_NAME }}
          PROFILE_NAME: ${{ vars.PROFILE_NAME }}
        # The --output stem ("card") becomes the shared file prefix,
        # i.e. card-<theme>.svg, matching the generated-branch naming.
        run: >-
          npm run generate --
          "$PLAYER_NAME"
          --profile "$PROFILE_NAME"
          --theme all
          --output "$RUNNER_TEMP/skycard-generated/card.svg"

      - name: Generate showcase
        run: |
          npm run showcase -- \
            card \
            "$RUNNER_TEMP/skycard-generated"

      - name: Check out generated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin generated || true
          git checkout -B generated origin/generated || git checkout -B generated

      - name: Copy generated themes
        run: |
          rm -rf generated
          mkdir -p generated
          cp "$RUNNER_TEMP/skycard-generated/"*.svg generated/
          cp "$RUNNER_TEMP/skycard-generated/"*.png generated/

      - name: Commit generated themes
        run: |
          # -f overrides .gitignore: generated/ is ignored on every branch,
          # but the generated branch still needs to track these files.
          git add -f generated/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate themes"
          git push --set-upstream origin generated
